# Configuração do bot. Edite à vontade: não precisa mexer no código.

# Plataformas que você acompanha. Notícias sem plataforma específica
# (indústria, lançamentos gerais, eventos) entram se incluir_gerais for true.
plataformas: [PC, PlayStation, Xbox, Nintendo]
incluir_gerais: true

# Horários do resumo no modo servidor (python -m gamebot --escutar), no fuso de Brasília.
# Cada horário gasta 1 chamada de IA. No GitHub Actions quem manda é o cron do workflow.
horarios_diarios: ["08:17", "13:17", "19:17"]

# Cópia do banco de notícias enviada para o seu chat (sem IA). Também dá para pedir com /backup.
backup:
  ativo: true
  dia: domingo
  hora: "03:17"

# Ranking da semana publicado no canal (1 chamada de IA por semana)
semanal:
  ativo: true
  dia: domingo
  hora: "10:17"

# Quantos itens cada resumo traz, no máximo
max_noticias: 8
max_promocoes: 6
max_por_fonte: 3      # para o resumo não virar o feed de um site só
dias_sem_repetir: 3            # não repete o mesmo assunto (mesmo com outro título) por 3 dias
dias_sem_repetir_promocao: 7   # não repete a promoção do mesmo jogo por 7 dias
previa_primeira: true          # mostra a imagem da primeira notícia no topo do post

# Só notícias publicadas nas últimas X horas
janela_horas: 30

# Palavras que tiram a notícia do resumo (filmes, séries, gadgets...)
palavras_bloqueadas:
  - movie
  - tv series
  - netflix
  - box office
  - filme
  - série
  # guias e detonados (sem valor como notícia)
  - safe code
  - how to
  - where to find
  - best settings
  - best build
  - guide
  - walkthrough
  - wordle

# Promoções de PC (API pública CheapShark)
promocoes:
  ativo: true
  desconto_minimo: 60
  nota_metacritic_minima: 75

# Tradução para português com IA.
# O bot tenta os provedores nesta ordem e pula os que não têm chave.
# As chaves ficam nos secrets do GitHub (ou no .env): OPENROUTER_API_KEY,
# GROQ_API_KEY, GEMINI_API_KEY e SAMBANOVA_API_KEY. Nunca neste arquivo.
ia:
  ativo: true
  provedores: [openrouter, groq, gemini, sambanova]
  # Busca por significado no /perguntar (embeddings). Usa a GEMINI_API_KEY.
  # Gasta 1 chamada por resumo e 1 por pergunta. Se falhar, a busca por palavras continua.
  embeddings:
    ativo: true
    provedores: [gemini]
    # modelos:
    #   gemini: gemini-embedding-001
  # Para trocar o modelo de um provedor (os modelos grátis mudam com o tempo):
  # llama-3.3-70b-versatile (Groq) e gemini-2.5-flash (Gemini) foram descontinuados.
  modelos:
    groq: openai/gpt-oss-120b
    gemini: gemini-3.5-flash
    sambanova: gpt-oss-120b

# Fontes de notícias (RSS). Pode ser só a URL ou {url, plataforma}.
# A plataforma vale para sites de uma plataforma só quando a notícia não cita nenhuma.
feeds:
  IGN: https://feeds.feedburner.com/ign/games-all
  GameSpot: https://www.gamespot.com/feeds/mashup/
  Eurogamer: https://www.eurogamer.net/feed
  PC Gamer:
    url: https://www.pcgamer.com/feeds.xml
    plataforma: PC
  Kotaku: https://kotaku.com/rss
  Polygon: https://www.polygon.com/rss/index.xml
  GamesRadar: https://www.gamesradar.com/rss/
  Rock Paper Shotgun: https://www.rockpapershotgun.com/feed
  Adrenaline: https://www.adrenaline.com.br/feed/
  Voxel: https://www.tecmundo.com.br/voxel/feed
  IGN Brasil: https://br.ign.com/feed.xml
