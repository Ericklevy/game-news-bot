name: Resumo diário

on:
  schedule:
    - cron: "17 11 * * *"   # todo dia às 8h17 (horário de Brasília)
  workflow_dispatch:         # botão "Run workflow" para testar na hora

concurrency:
  group: resumo-diario
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # O histórico do que já foi enviado fica num cache entre as execuções
      - name: Restaurar histórico
        uses: actions/cache/restore@v4
        with:
          path: data/gamebot.db
          key: gamebot-db-${{ github.run_id }}
          restore-keys: gamebot-db-

      - name: Enviar resumo
        run: python -m gamebot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # IA para traduzir (opcionais: o bot pula as que não existirem)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}

      - name: Salvar histórico
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/gamebot.db
          key: gamebot-db-${{ github.run_id }}
